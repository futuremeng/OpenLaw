name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Gofmt gate
        run: test -z "$(gofmt -l .)" || (gofmt -l .; echo "请运行 make fmt"; exit 1)

      - name: Test
        run: go test ./...
